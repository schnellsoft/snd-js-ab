<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <header>
        <section class="header-top">
            <div class="snd-ct-logo">
                <div class="snd-ct-logo-min">
                    <img src="./assets/logo_min.png" alt="Ark Medical Clinic" width="111" height="112">
                </div>
                <div class="snd-ct-logo-max">
                    <img src="./assets/logo.png" alt="Ark Medical Clinic" width="390" height="125">
                </div>
            </div>
            <div class="snd-ct-consultation">

                <button type="button" class="btn-appointment" aria-label="Programează o consultație">
                    <span class="status-indicator">
                      <span class="status-dot"></span>
                      <span class="status-pulse"></span>
                    </span>
                    <span class="btn-text">Programează o consultație</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                      <line x1="16" y1="2" x2="16" y2="6"></line>
                      <line x1="8" y1="2" x2="8" y2="6"></line>
                      <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                  </button>

            </div>
            <div class="snd-ct-menu">
                <div class="snd-list-comp">
                    <button
                        type="button"
                        class="snd-list-hamburger"
                        aria-label="Open menu"
                        aria-expanded="false"
                        popovertarget="snd-menu-drawer"
                    >
                        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <use href="sprite.svg#hamburger"></use>
                        </svg>
                    </button>
                    <div id="snd-menu-drawer" class="snd-menu-drawer" popover="auto"></div>
                    <button
                        type="button"
                        class="snd-list-more"
                        aria-label="More items"
                        aria-expanded="false"
                        popovertarget="snd-list-overflow"
                        hidden
                    >
                        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <use href="sprite.svg#morev"></use>
                        </svg>
                    </button>
                    <div id="snd-list-overflow" class="snd-list-overflow" popover="auto"></div>
                    <div class="snd-list-ct">
                        <nav class="snd-list" aria-label="Main menu"></nav>
                    </div>
                </div>
            </div>
            <div class="snd-ct-icons">
                <div class="snd-list-comp">
                    <button
                        type="button"
                        class="snd-list-more"
                        aria-label="More items"
                        aria-expanded="false"
                        popovertarget="snd-icons-overflow"
                        hidden
                    >
                        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <use href="sprite.svg#morev"></use>
                        </svg>
                    </button>
                    <div id="snd-icons-overflow" class="snd-list-overflow" popover="auto"></div>
                    <div class="snd-list-ct">
                        <div class="snd-list"></div>
                    </div>
                </div>
            </div>
            <div class="snd-ct-lang">
                <div class="ct-lang">
                    <label class="ct-lang-label" for="ct-lang-select">Language</label>
                    <select class="ct-lang-select" id="ct-lang-select" name="language">
                        <button>
                            <selectedcontent></selectedcontent>
                        </button>
                        <option value="ro" aria-label="Romanian" selected>
                            <svg class="ct-lang-flag" viewBox="0 0 24 16" aria-hidden="true">
                                <rect width="8" height="16" fill="#002b7f" />
                                <rect x="8" width="8" height="16" fill="#fcd116" />
                                <rect x="16" width="8" height="16" fill="#ce1126" />
                            </svg>
                            <span class="ct-lang-code">RO</span>
                        </option>
                        <option value="bg" aria-label="Bulgarian">
                            <svg class="ct-lang-flag" viewBox="0 0 24 16" aria-hidden="true">
                                <rect width="24" height="5.34" fill="#ffffff" />
                                <rect y="5.33" width="24" height="5.34" fill="#00966e" />
                                <rect y="10.66" width="24" height="5.34" fill="#d62612" />
                            </svg>
                            <span class="ct-lang-code">BG</span>
                        </option>
                        <option value="en" aria-label="English">
                            <svg class="ct-lang-flag" viewBox="0 0 60 30" aria-hidden="true">
                                <rect width="60" height="30" fill="#012169" />
                                <path d="M0 0 60 30M60 0 0 30" stroke="#fff" stroke-width="6" />
                                <path d="M0 0 60 30M60 0 0 30" stroke="#c8102e" stroke-width="2" />
                                <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10" />
                                <path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6" />
                            </svg>
                            <span class="ct-lang-code">ENG</span>
                        </option>
                    </select>
                </div>
            </div>
            <div class="snd-ct-user-status">
                <a class="snd-user-not-logged" href="#login" aria-label="Log in">
                    <img src="assets/login.svg" alt="" width="48" height="48">
                </a>
                <a class="snd-user-logged" href="#account" aria-label="Logged in" hidden>
                    <img src="assets/logged.svg" alt="" width="48" height="48">
                </a>
            </div>
        </section>
        <section class="header-bottom" hidden></section>
    </header>
    <main>
        <section class="main-content">
            <h2>Servicii oferite de noi</h2>
            <div class="main-content-services">
                <div class="ct-card-all">
                    <div class="ct-card-all-header">
                        <div class="ct-card-all-header-controls">
                            <div class="ct-card-all-search">
                                <form class="ct-search" role="search">
                                    <label class="ct-field-label" for="ct-search-input">Search</label>
                                    <div class="ct-search-row">
                                        <input
                                            id="ct-search-input"
                                            class="ct-search-input"
                                            type="search"
                                            name="q"
                                            placeholder="Search services"
                                            autocomplete="off"
                                            spellcheck="false"
                                        />
                                        <button class="ct-search-submit" type="submit" aria-label="Search">
                                            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                                <use href="#icon-search" fill="currentColor"></use>
                                            </svg>
                                        </button>
                                        <button class="ct-search-exit" type="button" aria-label="Exit search" hidden>
                                            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                                <use href="#icon-close" fill="currentColor"></use>
                                            </svg>
                                        </button>
                                    </div>
                                </form>
                            </div>
                            <div class="ct-card-all-combo">
                                <label class="ct-field-label" for="ct-combo-category">Category</label>
                                <select class="ct-combo" id="ct-combo-category" name="category">
                                    <option value="recommended" selected>Recommended Services</option>
                                </select>
                            </div>
                            <div class="ct-card-all-combo">
                                <label class="ct-field-label" for="ct-combo-subcategory">Subcategory</label>
                                <select class="ct-combo" id="ct-combo-subcategory" name="subcategory">
                                    <option value="" selected></option>
                                </select>
                            </div>
                        </div>
                        <div class="ct-card-all-header-position">
                            <button class="left-button" type="button" aria-label="Previous">
                                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <use href="#icon-left" fill="currentColor"></use>
                                </svg>
                            </button>
                            <p id="ct-nav-position" class="ct-nav-position" role="status" aria-live="polite" aria-atomic="true">1 of 17</p>
                            <button class="right-button" type="button" aria-label="Next">
                                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <use href="#icon-right" fill="currentColor"></use>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="ct-card-all-main">
                        <div class="ct-card">
                            <div class="ct-card-inner">
                                <div class="ct-card-front-face">
                                    <svg class="ct-card-bg" width="160" height="160" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <use href="#icon-generic" fill="currentColor"></use>
                                    </svg>
                                    <h2 class="ct-card-title">Standard Plan</h2>
                                    <div class="ct-card-foot">
                                        <p class="ct-card-price">$49</p>
                                        <button class="ct-card-select" type="button">Select</button>
                                    </div>
                                </div>
                                <div class="ct-card-back-face" aria-hidden="true">
                                    <svg class="ct-card-bg" width="160" height="160" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <use href="#icon-generic" fill="currentColor"></use>
                                    </svg>
                                    <h2 class="ct-card-title">Plus Plan</h2>
                                    <div class="ct-card-foot">
                                        <p class="ct-card-price">$79</p>
                                        <button class="ct-card-select" type="button" tabindex="-1">Select</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <section class="footer-content">
            <h1>Footer</h1>
        </section>
    </footer>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
        <symbol id="icon-left" viewBox="0 0 24 24" fill="none">
            <path d="M14.5 6.5 9 12l5.5 5.5 1.4-1.4L11.8 12 15.9 7.9 14.5 6.5Z" fill="currentColor" />
        </symbol>
        <symbol id="icon-right" viewBox="0 0 24 24" fill="none">
            <path d="M9.5 6.5 15 12l-5.5 5.5-1.4-1.4L12.2 12 8.1 7.9 9.5 6.5Z" fill="currentColor" />
        </symbol>
        <symbol id="icon-generic" viewBox="0 0 24 24" fill="none">
            <path d="M12 2.2 20.3 7v10L12 21.8 3.7 17V7L12 2.2Zm0 2.4L5.7 8.1v7.8L12 19.4l6.3-3.5V8.1L12 4.6Z" fill="currentColor" />
            <path d="M12 8.2 15.8 10.4v4.2L12 16.8 8.2 14.6v-4.2L12 8.2Z" fill="currentColor" />
        </symbol>
        <symbol id="icon-search" viewBox="0 0 24 24" fill="none">
            <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 19.49 19.49 20 15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z" fill="currentColor" />
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24" fill="none">
            <path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3 1.4 1.4Z" fill="currentColor" />
        </symbol>
    </svg>
    <script type="module" src="main.js"></script>
    <script type="module" src="icons.js"></script>
    <script type="module" src="appointment.js"></script>
    <script type="module" src="services.js"></script>
</body>
</html>
